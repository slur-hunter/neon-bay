<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Bay — Make GTA 6</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ffd23e'/%3E%3Ctext x='8' y='12' font-size='11' text-anchor='middle' fill='%23111' font-family='sans-serif' font-weight='bold'%3EN%3C/text%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1420; font-family: Arial, Helvetica, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .panel { position: absolute; color: #fff; background: rgba(12, 10, 22, 0.72); border: 1px solid rgba(255, 210, 122, 0.35); border-radius: 6px; padding: 8px 10px; font-size: 13px; line-height: 1.45; }
  #hud-tl { top: 12px; left: 12px; min-width: 240px; }
  #hud-tr { top: 12px; right: 12px; width: 300px; text-align: right; }
  #hud-bl { bottom: 12px; left: 12px; max-width: 420px; }
  #hud-br { bottom: 12px; right: 12px; text-align: right; background: transparent; border: none; padding: 0; }
  #stars { font-size: 20px; color: #ffd23e; letter-spacing: 2px; }
  .bar { height: 8px; background: rgba(255,255,255,0.18); border-radius: 4px; overflow: hidden; margin: 2px 0 4px; }
  .bar > div { height: 100%; }
  #health-fill { background: #3ecf5a; width: 100%; }
  #armour-fill { background: #4aa8ff; width: 0%; }
  #rp-fill { background: #ffd23e; width: 0%; }
  #stage-fill { background: #ff7ad9; width: 0%; }
  #damage-fill { background: #ff5a3c; width: 0%; }
  #money { font-size: 22px; font-weight: bold; color: #7dff9a; }
  #rank-name { font-weight: bold; color: #ffd23e; }
  #clock { font-size: 20px; font-weight: bold; color: #fff; }
  #mission-title { font-size: 16px; font-weight: bold; color: #ffd23e; }
  #mission-timer { font-size: 18px; font-weight: bold; }
  #speed { font-size: 20px; font-weight: bold; }
  #compass { font-size: 16px; font-weight: bold; color: #7fe7ff; }
  .police-row { color: #ffb3b3; }
  #dialogue { display: none; align-items: flex-start; gap: 8px; margin-top: 8px; background: rgba(12, 10, 22, 0.85); border: 1px solid rgba(255, 210, 122, 0.5); border-radius: 6px; padding: 8px; }
  #portrait { width: 56px; height: 56px; border-radius: 4px; flex: none; }
  #speaker { font-weight: bold; color: #ffd23e; }
  #dialogue-text { color: #fff; }
  #controls { margin-top: 8px; font-size: 11px; color: rgba(255,255,255,0.65); }
  #minimap { width: 160px; height: 160px; border: 1px solid rgba(255, 210, 122, 0.5); border-radius: 6px; display: block; margin-left: auto; }
  #sound-pill { display: inline-block; margin-top: 6px; background: rgba(12, 10, 22, 0.72); border: 1px solid rgba(255, 210, 122, 0.35); border-radius: 6px; padding: 4px 8px; font-size: 12px; color: #fff; }
  #banner { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity 0.4s; pointer-events: none; }
  #banner.show { opacity: 1; }
  .banner-big { font-size: 34px; font-weight: bold; color: #ffd23e; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
  .banner-small { font-size: 18px; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
  #title-card { position: absolute; top: 38%; left: 50%; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity 0.6s; pointer-events: none; }
  #title-card.show { opacity: 1; }
  .title-big { font-size: 44px; font-weight: bold; letter-spacing: 6px; color: #fff; text-shadow: 0 3px 12px rgba(0,0,0,0.85); }
  .title-small { font-size: 16px; letter-spacing: 4px; color: #ffd23e; text-shadow: 0 2px 8px rgba(0,0,0,0.85); }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Bay: an open-world crime game. Steal cars, outrun the cruisers, work off the debt."></canvas>
<div id="hud-tl" class="panel">
  <div id="stars">☆☆☆☆</div>
  <div id="health-num">HEALTH 100</div>
  <div class="bar"><div id="health-fill"></div></div>
  <div id="armour-num">ARMOUR 0</div>
  <div class="bar"><div id="armour-fill"></div></div>
  <div id="money">$0</div>
  <div id="rank-name">RANK D · DRIVER</div>
  <div class="bar"><div id="rp-fill"></div></div>
  <div id="rp-num">0 / 100 RP</div>
  <div id="district">DOWNTOWN · STANDING 0</div>
</div>
<div id="hud-tr" class="panel">
  <div id="clock">17:41</div>
  <div id="mission-title">THE PICKUP</div>
  <div id="mission-desc"></div>
  <div id="mission-job">JOB 1/4</div>
  <div><span id="mission-timer">0:00</span> · <span id="stage-num">STAGE 1/3</span></div>
  <div class="bar"><div id="stage-fill"></div></div>
  <div id="speed">ON FOOT</div>
  <div id="compass">↑ 0m</div>
  <div id="police-panel"></div>
</div>
<div id="hud-bl" class="panel">
  <div id="radio">SUNSET FM</div>
  <div id="car-line"></div>
  <div id="damage-num">DAMAGE 0%</div>
  <div class="bar"><div id="damage-fill"></div></div>
  <div id="dialogue">
    <canvas id="portrait" width="56" height="56"></canvas>
    <div><div id="speaker"></div><div id="dialogue-text"></div></div>
  </div>
  <div id="controls">WASD move / drive · Mouse drag look · E enter / exit car · Click punch · Space brake · M radio · X sound · P pause</div>
</div>
<div id="hud-br" class="panel">
  <canvas id="minimap" width="160" height="160"></canvas>
  <div id="sound-pill">SOUND ON · X</div>
</div>
<div id="banner"></div>
<div id="title-card"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
